name: PL/SQL IF-ELSE Autograding

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

      - name: Make test executable
        run: chmod +x test.sh

      - name: Run Autograding
        run: ./test.sh
